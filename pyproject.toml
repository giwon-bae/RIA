[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ria"
version = "2.1.0"
description = "RIA — 근거 수집 전문 에이전트의 결정론적 코어 (RIA Core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "giwon-bae" }]

# RIA Core 는 모델을 호출하지 않는다 (DESIGN §3.4).
# openai / Responses API 클라이언트 / Agents SDK 등 과금형 AI SDK 를 의존성에 넣지 않는다.
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ria = "ria.cli:main"

[tool.setuptools.packages.find]
include = ["ria*"]

[tool.setuptools.package-data]
ria = ["policy/*.yaml", "migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
