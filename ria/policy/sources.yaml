    fallback_sources: [naver_datalab]
    policy_urls:
      - https://developers.naver.com/notice/article/32530
      - https://developers.naver.com/products/terms/
    notes: 쇼핑 분야 상대 클릭 트렌드다. API Hub 이관이 필요하다.

  - source_id: naver_shopping_search
    name: NAVER 쇼핑 검색 API (서비스 종료)
    pack_ids: [commerce-signal]
    access_status: blocked
    access_method: none
    official: true
    commercial_use: not_applicable
    auth_type: none
    rate_limit_model: unknown
    storage_policy: no_storage
    deletion_policy: none_required
    allowed_data_types: []
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: false
    fallback_sources: []
    policy_urls:
      - https://developers.naver.com/notice/article/32530
    notes: 2026-07-31 서비스 종료. 대체 API 가 없다. collector 를 만들지 않는다.

  - source_id: google_trends
    name: Google Trends API (Alpha)
    pack_ids: [search-demand]
