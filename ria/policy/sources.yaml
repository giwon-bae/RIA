    commercial_use: unclear
    auth_type: api_key
    rate_limit_model: unknown
    storage_policy: no_storage
    deletion_policy: none_required
    allowed_data_types: []
    blocked_data_types: [absolute_search_volume, personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [naver_datalab]
    policy_urls:
