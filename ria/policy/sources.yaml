  # --- search-demand -------------------------------------------------------
  - source_id: naver_search
    name: NAVER 검색 API (API Hub)
    pack_ids: [search-demand]
    access_status: core
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: api_key
    rate_limit_model: unknown
    storage_policy: retain_allowed
    deletion_policy: source_specific
    allowed_data_types: [search_results, content_metadata]
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [web-primary]
    policy_urls:
      - https://developers.naver.com/notice/article/32530
      - https://developers.naver.com/products/terms/
    notes: 애플리케이션 등록과 약관 준수가 필요하다. 기존 개발자센터 API 는 2027-06-30 종료 예정이라 API Hub 이관이 필요하다.

  - source_id: naver_datalab
    name: NAVER DataLab 검색어 트렌드
    pack_ids: [search-demand]
    access_status: core
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: api_key
    rate_limit_model: unknown
    storage_policy: retain_allowed
    deletion_policy: source_specific
    # 상대 지수만 허용한다. 절대 검색량으로 표현하는 것을 데이터 타입 수준에서 막는다 (DESIGN §6.3).
    allowed_data_types: [relative_search_index]
    blocked_data_types: [absolute_search_volume, personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [naver_search]
    policy_urls:
      - https://developers.naver.com/notice/article/32530
      - https://developers.naver.com/products/terms/
    notes: 상대 지수이며 절대 검색량이 아니다. API Hub 이관이 필요하다.

  - source_id: naver_shopping_insight
    name: NAVER 쇼핑인사이트
    pack_ids: [search-demand, commerce-signal]
    access_status: core
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: api_key
    rate_limit_model: unknown
