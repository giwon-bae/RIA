  # --- community-signal ----------------------------------------------------
  # 승인 신청 진행 중 — 승인 시 이 필드만 전환
  - source_id: reddit
    name: Reddit Data API
    pack_ids: [community-signal]
    access_status: blocked
    access_method: official_api
    official: true
    commercial_use: separate_agreement_required
    auth_type: oauth
    # 공식 문서에 rate limit 수치가 없다. X-Ratelimit-* 응답 헤더를 읽어 처리한다.
    rate_limit_model: server_headers
    storage_policy: approved_use_only
    deletion_policy: source_specific
    allowed_data_types: []
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-27
    verify_before_use: true
    fallback_sources: [threads, web-primary]
    policy_urls:
      - https://redditinc.com/policies/data-api-terms
      - https://support.reddithelp.com/hc/en-us/articles/42728983564564-Responsible-Builder-Policy
      - https://support.reddithelp.com/hc/en-us/articles/14945211791892-Developer-Platform-Accessing-Reddit-Data
      - https://support.reddithelp.com/hc/en-us/articles/49381918834964-Reddit-for-Researchers-Program
    notes: 승인 신청 진행 중 — 승인 시 이 필드만 전환. 비상업 이용도 Data Access Request 승인이 필수다. 승인 전 실호출 금지.

  # 미승인 시 본인 게시물만 검색 — App Review 신청 진행 중
  - source_id: threads
    name: Threads API (keyword search)
    pack_ids: [community-signal]
    access_status: conditional
    access_method: official_api
    official: true
    commercial_use: unclear
    auth_type: oauth
    rate_limit_model: daily_quota
    quota:
      limit: 2200
      window_hours: 24
      scope: per_user
      note: 앱 간 합산. 0건 응답은 미차감. limit 파라미터 최대 100.
    storage_policy: approved_use_only
    deletion_policy: source_specific
    allowed_data_types: []
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-27
    verify_before_use: true
    fallback_sources: [reddit, web-primary]
    policy_urls:
      - https://developers.facebook.com/docs/threads/keyword-search/
      - https://developers.facebook.com/docs/threads/get-started
      - https://www.postman.com/meta/threads/collection/dht3nzz/threads-api
    notes: 미승인 시 본인 게시물만 검색 — App Review 신청 진행 중. threads_basic 과 threads_keyword_search 권한이 필요하다. 장기 토큰 60일.

  - source_id: x_twitter
    name: X (Twitter) API
    pack_ids: [community-signal]
    access_status: blocked
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: oauth
    rate_limit_model: paid_tier
    storage_policy: approved_use_only
    deletion_policy: source_specific
    allowed_data_types: []
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [threads, web-primary]
    policy_urls: []
    notes: 읽기 비용과 사용 제약이 현재 예산 정책과 맞지 않는다. 기본 비활성화한다.

  # --- video-signal --------------------------------------------------------
  - source_id: youtube_data
    name: YouTube Data API v3
    pack_ids: [video-signal]
    access_status: conditional
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: api_key
    rate_limit_model: daily_quota
    # 비인가 공개 데이터는 30일 이내 삭제 또는 갱신해야 한다.
    storage_policy: refresh_or_delete_30d
    deletion_policy: delete_or_refresh_30d
    allowed_data_types: [video_metadata, engagement_metric]
    blocked_data_types:
      - personal_sensitive_data
      - cross_platform_merged_metric
      - derived_metric
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [web-primary]
    policy_urls:
      - https://developers.google.com/youtube/terms/developer-policies
      - https://developers.google.com/youtube/v3/determine_quota_cost
    notes: 보관·표현 정책 구현이 필수다. 30일 retention, 플랫폼 간 데이터 구분, 파생 지표 제한.

