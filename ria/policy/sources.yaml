# Source Registry — 플랫폼 접근·상업 이용·보관 정책의 정본 (DESIGN §8.1)
#
# 플랫폼 정책을 코드 상수나 README 문장으로 관리하지 않는다. 이 파일이 정본이다.
# 승인·거절 같은 상태 변화는 `access_status` 와 `last_verified_at` 을 갱신해서 반영한다.
# 코드를 고치지 않는다 (DESIGN §21 승인 대기 원칙 1).
#
# 시드 근거: DESIGN §7 판정표 20행 (기준일 2026-08-11).
#            Reddit·Threads 항목은 2026-08-27 공식 문서로 재확인.
# policy_urls 는 DESIGN §7.1 에 링크가 있는 소스만 채운다. 없는 소스는 빈 배열로 두고
# 추측한 URL 을 넣지 않는다.

version: "2.1"
verified_baseline: 2026-08-11

# Source Pack 10종 (DESIGN §5.1). pack_ids 는 이 목록 안에서만 쓴다.
packs:
  - authority-stats
  - company-market
  - search-demand
  - community-signal
  - tech-launch
  - video-signal
  - app-market
  - commerce-signal
  - regulation-policy
  - web-primary

sources:
  # --- authority-stats -----------------------------------------------------
  - source_id: kosis
    name: KOSIS 국가통계포털
    pack_ids: [authority-stats]
    access_status: core
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: api_key
    rate_limit_model: dataset_specific
    storage_policy: retain_allowed
    deletion_policy: none_required
    allowed_data_types: [public_statistics, statistical_metadata]
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [data_go_kr, world_bank]
    policy_urls:
      - https://kosis.kr/openapi/file/openApi_manual_v1.0.pdf
    notes: 공개 통계와 메타정보를 제공한다. 자료별 이용 조건은 호출 전 확인한다.

  - source_id: data_go_kr
    name: 공공데이터포털
    pack_ids: [authority-stats, regulation-policy]
    access_status: core
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: api_key
    rate_limit_model: dataset_specific
    storage_policy: retain_allowed
    deletion_policy: source_specific
    allowed_data_types: [public_statistics, public_dataset, statistical_metadata]
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [kosis]
    policy_urls: []
    notes: 데이터셋별로 이용허락·트래픽·활용신청 조건이 다르다. 데이터셋 단위로 정책을 검사한다.

  - source_id: world_bank
    name: World Bank Open Data
    pack_ids: [authority-stats]
    access_status: core
    access_method: official_api
    official: true
    commercial_use: allowed_with_conditions
    auth_type: none
    rate_limit_model: unknown
    storage_policy: retain_allowed
    deletion_policy: none_required
    allowed_data_types: [public_statistics, statistical_metadata]
    blocked_data_types: [personal_sensitive_data]
    last_verified_at: 2026-08-11
    verify_before_use: true
    fallback_sources: [kosis]
    policy_urls: []
    notes: 무인증으로 호출할 수 있다. 개별 데이터셋 조건은 확인한다.

  # --- company-market ------------------------------------------------------
